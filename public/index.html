<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OHO.COMPANY · 오호컴퍼니</title>
<meta name="description" content="크루방송의 새로운 전환점. 오호컴퍼니">
<meta property="og:title" content="OHO.COMPANY · 오호컴퍼니">
<meta property="og:description" content="크루방송의 새로운 전환점. 오호컴퍼니">
<meta property="og:image" content="/media/oho-logo.png">
<link rel="icon" href="/media/oho-mark.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-5Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-8ExtraBold.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}
/* Layout: sticky crest header + tab nav, one content column (max 1120px), gold hairlines instead of boxes */
:root{
  --bg:#ffffff; --surface:#f8f6f2; --surface-2:#efebe4; --line:#e0d8ca; --line-soft:#ece7de;
  --gold:#a07b34; --gold-hi:#7d5c1e; --ink:#2a2318; --mute:#6c6250; --faint:#9a8e78; --on-gold:#fffaf0;
  --ok:#7fb68a; --live:#e5484d; --warn:#d9a441; --bad:#d2705e;
  --f-display:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-kr-display:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.crest{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.crest b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--gold-hi)}
.crest span{font-family:var(--f-display);font-size:13px;letter-spacing:.32em;color:var(--ink)}
.crest-mark{height:30px;width:auto;display:block}
.admin-pill{font-size:11px;letter-spacing:.08em;padding:3px 10px;border:1px solid var(--gold);color:var(--gold-hi);border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--mute);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--gold-hi);border-bottom-color:var(--gold)}

main{padding-block:36px 72px;min-height:60vh}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;color:var(--gold)}
h1,h2,h3{font-family:var(--f-kr-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,36px)}
h2{font-size:22px}
h3{font-size:18px}
.lead{color:var(--mute);margin:6px 0 0;max-width:62ch}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.btn.gold:hover{background:var(--gold-hi);border-color:var(--gold-hi);color:var(--on-gold)}
.btn.ghost{background:none}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{padding-block:8px 36px;border-bottom:1px solid var(--line-soft);margin-bottom:36px}
.hero .mark{font-family:var(--f-display);font-weight:500;font-size:clamp(40px,8vw,84px);line-height:1;letter-spacing:.04em;color:var(--ink)}
.hero .mark em{color:var(--gold-hi)}
.hero p{color:var(--mute);max-width:56ch;margin:14px 0 0}

/* label cards */
.label-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px}
.label-card{position:relative;background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:16px;overflow:hidden;min-width:0}
.label-card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 100% 0%,color-mix(in srgb,var(--lc) 14%,transparent),transparent 60%);pointer-events:none}
.label-card:hover{border-color:color-mix(in srgb,var(--lc) 60%,var(--line))}
.lc-head{display:flex;gap:16px;align-items:center;position:relative}
.seal{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--lc) 70%,transparent);background:color-mix(in srgb,var(--lc) 16%,var(--surface-2));font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--ink);overflow:hidden}
.seal img{width:100%;height:100%;object-fit:cover}
.lc-en{font-family:var(--f-display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--lc) 55%,var(--ink))}
.lc-tag{color:var(--mute);font-size:14px;margin:0;position:relative}
.lc-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-soft);padding-top:14px;position:relative}
.lc-stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.lc-stats small{font-size:11px;color:var(--faint);letter-spacing:.06em}
.lc-stats strong{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-count{position:relative;font-size:13px;color:var(--mute);border-top:1px solid var(--line-soft);padding-top:14px}
.lc-count b{color:var(--ink);font-variant-numeric:tabular-nums}
.lc-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative}

.lc-banner{display:block;margin:-26px -24px 0;width:calc(100% + 48px);max-width:none;aspect-ratio:3/1;object-fit:cover;border-bottom:1px solid var(--line-soft);position:relative}
.ld-banner{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:4px;margin-bottom:24px;border:1px solid var(--line-soft)}
/* home */
.home-hero{padding-block:28px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
.home-hero .mark{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,9vw,92px);line-height:1;letter-spacing:.04em}
.home-hero .mark em{color:var(--gold-hi);}
.hh-logo{display:block;width:min(300px,66vw);height:auto;max-width:100%;margin-inline:auto}
.hh-sub{margin-top:18px;font-size:clamp(16px,2.4vw,20px);font-weight:500;color:var(--mute);text-wrap:balance}
.hh-sub b{color:var(--ink);font-weight:800}
.hh-banner{display:block;width:100%;margin-top:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line-soft);background:var(--surface);position:relative}
.hh-banner img{display:block;width:100%;height:auto;max-width:100%}
.hh-banner .bn-edit{position:absolute;top:10px;right:10px}
.hh-banner-empty{width:100%;margin-top:28px;border:1px dashed var(--line);border-radius:6px;padding:36px 16px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px}
.hh-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.hh-btns .live-dot{width:8px;height:8px;background:#ffd5d0}
.hh-btns .live-dot.off{background:rgba(255,250,240,.45)}
.hb-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-bottom:36px}
.hb-card{position:relative;display:block;padding:0;border:1px solid var(--line-soft);border-radius:4px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;aspect-ratio:3/1;max-width:100%}
.hb-card:hover{border-color:var(--lc)}
.hb-card img{width:100%;height:100%;object-fit:cover;display:block}
.hb-ph{display:grid;place-items:center;height:100%;font-family:var(--f-display);letter-spacing:.2em;color:var(--mute)}
.hb-cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:28px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.hb-cap b{font-family:var(--f-kr-display);font-size:17px;color:#fff}
.hb-cap span{font-size:12.5px;color:#e6dcc6}
.li-go{font-size:12px;color:var(--mute);white-space:nowrap}
/* labels accordion */
.labels-x{margin-block:72px}
.x-title{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,10vw,120px);line-height:.92;letter-spacing:-.035em;text-transform:uppercase;display:flex;flex-direction:column;margin-bottom:40px}
.x-gold{color:var(--gold);display:inline-flex;align-items:flex-end;gap:.08em}
.x-caret{display:inline-block;width:.06em;height:.82em;background:var(--gold);margin-bottom:.06em}
.acc-list{border-top:1px solid var(--line)}
.acc{border-bottom:1px solid var(--line)}
.acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:none;border:0;padding:28px 4px;cursor:pointer;text-align:left;color:var(--faint)}
.acc-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.acc-en{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6.4vw,68px);line-height:1;letter-spacing:-.03em;text-transform:uppercase;color:color-mix(in srgb,var(--faint) 75%,var(--bg));overflow-wrap:anywhere;transition:color .2s}
.acc-kr{font-size:14px;color:var(--mute)}
.acc-head:hover .acc-en,.acc.open .acc-en{color:var(--ink)}
.acc.open .acc-en{color:var(--lc)}
.acc-ch{flex:none;color:var(--mute);transition:transform .25s}
.acc.open .acc-ch{transform:rotate(180deg);color:var(--ink)}
.acc-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;padding:0 4px 32px;align-items:start}
.acc-banner{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:4px;border:1px solid var(--line-soft);max-width:100%}
.acc-info{display:flex;flex-direction:column;gap:16px;min-width:0}
.acc-tag{margin:0;font-size:16px;font-weight:500}
.acc-mem{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acc-mem-n{font-size:12.5px;color:var(--mute);margin-right:6px}
.acc-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.acc-chip .live-dot{background:var(--live)}
@media (max-width:760px){.acc-body{grid-template-columns:1fr}}
/* live */
.live{margin-block:48px 8px;padding:36px clamp(16px,3vw,32px) 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center}
.live .x-row,.live .x-sub,.live .chips{justify-content:center}
.live .live-row{text-align:left}
.x-row{flex-direction:row;flex-wrap:wrap;gap:.22em;margin-bottom:14px;font-size:clamp(36px,6vw,68px)}
.x-sub{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-size:15px;color:var(--mute)}
.x-sub b{color:var(--ink);font-weight:800}
.live-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.live-head h2{font-family:var(--f-display);font-size:20px;letter-spacing:.12em}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--live)}
.live-dot.off{background:var(--faint)}
.live-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.live-item{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--bg);border:1px solid color-mix(in srgb,var(--live) 50%,var(--line));border-radius:4px;text-decoration:none;min-width:0}
.live-item:hover{border-color:var(--live)}
.live-item .portrait,.live-item .seal{width:48px;height:48px;font-size:18px}
.live-item .li-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.live-item .li-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-item .li-t span{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-live{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--live);padding:1px 7px;border-radius:3px;align-self:center}
.live-empty{color:var(--mute);font-size:14px}
/* label detail */
.ld-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line-soft);margin-bottom:32px}
.ld-head .seal{width:88px;height:88px;font-size:36px}
.section{margin-bottom:44px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.section-title h2{font-size:19px}
.count{font-family:var(--f-display);color:var(--gold);font-size:15px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--line);background:none;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--lc,var(--gold))}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--surface)}

/* members */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.member{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:20px 12px 16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;min-width:0}
.portrait{width:92px;height:92px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--lc,var(--gold)) 18%,var(--surface-2));border:1px solid color-mix(in srgb,var(--lc,var(--gold)) 55%,transparent);font-family:var(--f-kr-display);font-size:28px;color:var(--ink)}
.portrait img{width:100%;height:100%;object-fit:cover}
.subs{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.foot-admin{background:none;border:0;color:var(--faint);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.member .nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.member .rl{font-size:11.5px;letter-spacing:.08em;color:var(--gold)}
.member .links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.member .links a{font-size:12px;color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line)}
.member .links a:hover{color:var(--gold-hi)}

/* member marquee */
.mq{display:flex;flex-direction:column;gap:16px;margin:-12px 0 40px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq-row{overflow:hidden}
.mq-track{display:flex;gap:14px;width:max-content}
.mq-row:hover .mq-track{animation-play-state:paused}
.mq-card{position:relative;flex:none;width:calc((min(100vw,1120px) - 40px)/3.15);aspect-ratio:4/5;border-radius:14px;padding:0;cursor:pointer;transition:transform .25s;overflow:hidden;background:color-mix(in srgb,var(--lc) 18%,var(--surface-2));border:0}
.mq-card img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.mq-init{display:grid;place-items:center;height:100%;font-size:44px;font-weight:800;color:color-mix(in srgb,var(--lc) 70%,var(--ink))}
.mq-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;display:flex;flex-direction:column;line-height:1.25}
.mq-cap b{font-size:14px;font-weight:700}
.mq-cap small{font-size:11px;opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .mq-track{animation:mq-left linear infinite}
  .mq-row.rev .mq-track{animation-name:mq-right}
  @keyframes mq-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes mq-right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
}
@media (prefers-reduced-motion:reduce){.mq-row{overflow-x:auto}}
.mq-card:hover{transform:translateY(-4px)}
.mq-live{position:absolute;top:14px;right:14px}
.mq-cap b{font-size:clamp(16px,2vw,22px)}
.mq-cap{top:0;bottom:auto;padding:18px 20px;text-align:left;align-items:flex-start;background:none!important;text-shadow:0 1px 3px rgba(0,0,0,.5),0 0 10px rgba(0,0,0,.3)}
.mq-cap small{font-size:13px;font-weight:500;opacity:.9;letter-spacing:.02em}
.mq-cap b{margin-top:2px;font-weight:800}
.mq-init{font-size:clamp(48px,7vw,88px)}
@media (max-width:760px){.mq-card{width:calc((100vw - 40px)/2.2)}}
/* member popup */
.modal.mp{width:min(380px,100%);align-items:center;text-align:center;position:relative;padding:32px 24px 26px;gap:12px}
.mp-x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:18px;color:var(--mute);cursor:pointer;padding:6px}
.mp-ph{width:132px;height:132px;font-size:44px;box-shadow:0 0 0 4px var(--surface),0 0 0 5px color-mix(in srgb,var(--lc) 55%,transparent)}
.mp-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.mp-tags .lbadge{margin:0}
.mp-name{font-size:30px;font-weight:800;letter-spacing:-.02em}
.mp-links{display:flex;flex-direction:column;gap:8px;width:100%}
.mp-links .btn{justify-content:center;padding:11px 16px;font-size:14px}
.member.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--gold);transform:scale(1.04)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
/* member detail */
.md{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
.md-photo{width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--lc) 18%,var(--surface-2));border:1px solid color-mix(in srgb,var(--lc) 35%,var(--line-soft));display:grid;place-items:center;max-width:100%}
.md-photo img{width:100%;height:100%;object-fit:cover;max-width:none}
.md-photo .mq-init{font-size:96px}
.md-info{display:flex;flex-direction:column;gap:14px;padding-top:8px;min-width:0}
.md-name{font-size:clamp(40px,7vw,72px);font-weight:800;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.md-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.md-links .btn{padding:10px 18px;font-size:14px}
@media (max-width:760px){.md{grid-template-columns:1fr}.md-photo{max-width:340px}}
/* calendar */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-month{font-family:var(--f-display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.cal-month small{font-family:var(--f-body);font-size:14px;color:var(--mute);margin-left:8px}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line-soft);min-width:320px}
.cal .dow{padding:8px;font-size:11.5px;letter-spacing:.12em;color:var(--faint);text-align:center;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line)}
.cal .dow.sun{color:var(--bad)}

<body>
<script>
/* 사이트 데이터 연결: /api 서버와 통신 (읽기·저장·이미지 업로드·관리자 로그인) */
(function(){
  var API='/api';
  var token=null, uid=null;
  try{ token=localStorage.getItem('oho_admin'); }catch(e){}
  try{ uid=localStorage.getItem('oho_uid'); if(!uid){ uid='v'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):Math.random().toString(36).slice(2)+Date.now().toString(36)); localStorage.setItem('oho_uid',uid); } }catch(e){ uid='v'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
  function hdr(){ return token?{Authorization:'Bearer '+token}:{}; }
  var DATA=null, ADMIN=false, listeners=new Set();
  function emit(){ listeners.forEach(function(f){ try{f();}catch(e){console.error(e);} }); }
  async function load(){
    var r=await fetch(API+'/data',{headers:hdr(),cache:'no-store'});
    var j=await r.json(); if(!r.ok) throw new Error(j.error||'불러오기 실패');
    DATA=j.data; ADMIN=!!j.admin;
    if(token&&!ADMIN){ token=null; try{localStorage.removeItem('oho_admin');}catch(e){} }
    emit();
  }
  var ready=load().catch(function(e){ console.warn(e); DATA=DATA||{labels:{},members:{},events:{},hall:{},posts:{},settings:{}}; emit(); });
  setInterval(function(){ if(!document.hidden && !document.querySelector('.modal-bg')) load().catch(function(){}); },30000);

  function err(code,msg){ var e=new Error(msg); e.code=code; return e; }
  function snapDoc(id,d){ return {id:id, exists:!!d, data:function(){ return d?JSON.parse(JSON.stringify(d)):undefined; }, metadata:{}}; }
  function newId(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

  async function write(op,col,id,data){
    if(col==='applications' && !ADMIN){
      if(op!=='set') throw err('invalid_argument','권한이 없어요');
      var r=await fetch(API+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,data:data})});
      var j=await r.json().catch(function(){return {};}); if(!r.ok) throw err('unavailable',j.error||'제출하지 못했어요');
      return;
    }
    var r2=await fetch(API+'/save',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify({op:op,col:col,id:id,data:data})});
    var j2=await r2.json().catch(function(){return {};});
    if(!r2.ok) throw err(r2.status===401?'invalid_argument':'unavailable', j2.error||'저장하지 못했어요');
    DATA[col]=DATA[col]||{};
    if(op==='delete') delete DATA[col][id];
    else if(op==='update') DATA[col][id]=Object.assign({},DATA[col][id],data);
    else DATA[col][id]=data;
    emit();
  }
  function docRef(col,id){
    return { id:id, path:col+'/'+id,
      get: async function(){ await ready; return snapDoc(id,(DATA[col]||{})[id]); },
      set: function(d){ return write('set',col,id,JSON.parse(JSON.stringify(d))); },
      update: function(d){ return write('update',col,id,JSON.parse(JSON.stringify(d))); },
      delete: function(){ return write('delete',col,id); },
      onSnapshot: function(next){ var f=function(){ if(DATA) next(snapDoc(id,(DATA[col]||{})[id])); }; listeners.add(f); ready.then(f); return function(){ listeners.delete(f); }; }
    };
  }
  function query(col,ord){
    function snapQ(){
      var arr=Object.keys(DATA[col]||{}).map(function(id){ return {id:id,d:DATA[col][id]}; });
      if(ord) arr.sort(function(a,b){ var x=a.d[ord.f], y=b.d[ord.f]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (x<y?-1:x>y?1:0)*(ord.dir==='desc'?-1:1); });
      else arr.sort(function(a,b){ return a.id<b.id?-1:1; });
      var docs=arr.map(function(o){ return snapDoc(o.id,o.d); });
      return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return [];},metadata:{}};
    }
    return {
      orderBy: function(f,dir){ return query(col,{f:f,dir:dir||'asc'}); },
      where: function(){ return this; }, limit: function(){ return this; },
      doc: function(id){ return docRef(col,id||newId()); },
      add: async function(d){ var ref=docRef(col,newId()); await ref.set(d); return ref; },
      get: async function(){ await ready; return snapQ(); },
      onSnapshot: function(next){ var f=function(){ if(DATA) next(snapQ()); }; listeners.add(f); ready.then(f); return function(){ listeners.delete(f); }; }
    };
  }
  var db={ collection:function(c){ return query(c); }, doc:function(p){ var a=p.split('/'); return docRef(a[0],a[1]); } };
  var user={ id:async function(){ return uid; }, isOwner:async function(){ await ready; return ADMIN; }, canEdit:async function(){ await ready; return ADMIN; }, can:async function(){ return null; }, me:async function(){ return {id:uid}; } };

  async function shrink(file){
    if(file.type==='image/gif' || file.size<1500000) return file;
    try{
      var img=await createImageBitmap(file);
      var s=Math.min(1,1800/Math.max(img.width,img.height));
      var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var type=file.type==='image/png'?'image/png':'image/jpeg';
      var b=await new Promise(function(r){ c.toBlob(r,type,0.88); });
      if(b.size>4000000) b=await new Promise(function(r){ c.toBlob(r,'image/jpeg',0.8); });
      return b;
    }catch(e){ return file; }
  }
  var assets={ upload: async function(file){
    var b=await shrink(file);
    if(b.size>4400000) throw err('too_large','이미지가 너무 커요. 4MB 이하로 줄여서 올려주세요.');
    var r=await fetch(API+'/upload?type='+encodeURIComponent(b.type||file.type),{method:'POST',headers:Object.assign({'Content-Type':'application/octet-stream'},hdr()),body:b});
    var j=await r.json().catch(function(){return {};});
    if(!r.ok) throw err('upstream_error',j.error||'이미지를 올리지 못했어요');
    return {id:j.url,url:j.url,sizeBytes:b.size,contentType:b.type};
  }};

  window.claude={ use: async function(n){ if(n==='db') return db; if(n==='user') return user; if(n==='assets'){ await ready; return ADMIN?assets:null; } return null; } };
  window.OHO={
    login: async function(pw){
      var r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
      var j=await r.json().catch(function(){return {};}); if(!r.ok) throw new Error(j.error||'로그인하지 못했어요');
      try{ localStorage.setItem('oho_admin',j.token); }catch(e){ throw new Error('브라우저 저장소를 쓸 수 없어서 로그인할 수 없어요'); }
    },
    logout: function(){ try{ localStorage.removeItem('oho_admin'); }catch(e){} }
  };
})();

</script>

<script>
(() => {
const S = {
  db:null, assets:null, uid:null, admin:false, canWrite:false, ready:false, offline:false,
  labels:[], members:[], events:[], hall:[], posts:[], apps:[],
  tab:'home', yt:{}, liveFilter:'all', labelId:null, memberFilter:'all', month:startOfMonth(new Date()), postId:null,
  applied:null, applyDone:false
};
const TABS = ['home','labels','members','schedule','hall','board','apply'];
const app = document.getElementById('app');

/* ---------- utils ---------- */
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
const DOW=['일','월','화','수','목','금','토'];
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return `${y}.${pad(m)}.${pad(d)} (${DOW[dt.getDay()]})`; }
function fmtTs(t){ if(!t) return ''; const d=new Date(t); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; }
function safeUrl(u){ u=String(u||'').trim(); return /^https?:\/\//i.test(u)?u:''; }
function blob(id){ if(!id) return ''; return /^(https?:|\/)/.test(id)?id:'/media/'+id+'.jpg'; }
function yt(m){ return (S.yt&&S.yt[m.id])||{}; }
function mPhoto(m){ return m.photo||yt(m).photo||''; }
function isLive(m){ return !!(m.live||yt(m).live); }
function liveUrlOf(m){ return yt(m).liveUrl||safeUrl(m.liveUrl)||safeUrl(m.channelUrl)||safeUrl(m.soopUrl); }
function fmtSubs(n){ if(n==null||isNaN(n)) return ''; n=Number(n); if(n>=10000) return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만명'; if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'천명'; return n+'명'; }
function label(id){ return S.labels.find(l=>l.id===id); }
function lc(id){ const l=label(id); return l?.color || '#c9a45c'; }
function initial(name){ return esc(String(name||'?').trim().charAt(0)||'?'); }
function seal(l,cls=''){
  const img = l?.logo ? `<img src="${blob(l.logo)}" alt="" onerror="this.remove()">` : '';
  return `<span class="seal ${cls}" style="--lc:${esc(l?.color||'#c9a45c')}">${img||initial(l?.en||l?.name)}</span>`;
}
function upcoming(labelId){
  const t=todayStr();
  return S.events.filter(e=>(!labelId||e.labelId===labelId)&&e.date>=t).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
}
function latestWin(labelId){
  return S.hall.filter(h=>h.labelId===labelId&&h.rank==='우승').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
}

/* ---------- routing ---------- */
function go(tab, opts={}){
  if(!TABS.includes(tab)) tab='home';
  S.tab=tab; S.labelId=opts.labelId||null; S.postId=opts.postId||null; S.memberId=opts.memberId||null;
  if(opts.memberFilter) S.memberFilter=opts.memberFilter;
  try{ history.replaceState(null,'','#'+tab); }catch(e){}
  render(); window.scrollTo({top:0});
}
function fromHash(){ const h=(location.hash||'').slice(1); if(TABS.includes(h)) S.tab=h; }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.go===S.tab?'page':'false'));
  document.getElementById('adminPill').hidden=!S.admin;
  const fa=document.getElementById('footAdmin'); if(fa) fa.hidden=!!S.admin;
  const fn={home:viewHome, labels:S.labelId?viewLabel:viewLabels, members:viewMembers, schedule:viewSchedule, hall:viewHall, board:S.postId?viewPost:viewBoard, apply:viewApply}[S.tab];
  app.innerHTML = fn();
}
function loadingNote(){ return S.ready?'':`<p class="lead">데이터를 불러오는 중…</p>`; }
function offlineNote(){ return S.offline?`<div class="note-box" style="margin-bottom:24px">지금은 내용을 불러올 수 없어요. 잠시 후 새로고침해 주세요.</div>`:''; }
function adminBtn(act, text, extra=''){ return S.admin?`<button class="btn sm" data-act="${act}" ${extra}>${text}</button>`:''; }

/* 1. labels */
function viewLabels(){
  const cards = S.labels.map(l=>{
    const mem=S.members.filter(m=>m.labelId===l.id).length;
    const site=safeUrl(l.siteUrl);
    return `<article class="label-card" style="--lc:${esc(l.color||'#c9a45c')}">
      ${l.banner?`<img class="lc-banner" src="${blob(l.banner)}" alt="${esc(l.name)} 배너" onerror="this.remove()">`:''}
      <div class="lc-head">${seal(l)}<div style="min-width:0"><div class="lc-en">${esc(l.en||'')}</div><h2>${esc(l.name)}</h2></div></div>
      ${l.tagline?`<p class="lc-tag">${esc(l.tagline)}</p>`:''}
      <div class="lc-count">멤버 <b>${mem}</b>명</div>
      <div class="lc-actions">
        <button class="btn gold" data-act="openLabel" data-id="${esc(l.id)}">${esc(l.name)} →</button>
        ${site?`<a class="btn ghost" href="${esc(site)}" target="_blank" rel="noopener">공식 홈페이지 ↗</a>`:''}
        ${adminBtn('editLabel','수정',`data-id="${esc(l.id)}"`)}
      </div>
    </article>`;
  }).join('');
  return `${offlineNote()}
    <div class="page-head"><div><div class="eyebrow">Labels</div><h1>레이블</h1><p class="lead">레이블을 골라 멤버와 시즌 기록을 확인하세요.</p>${loadingNote()}</div>${adminBtn('newLabel','+ 레이블 추가')}</div>
    ${S.labels.length?`<div class="label-grid">${cards}</div>`:`<div class="empty"><b>등록된 레이블이 없어요</b>${S.admin?'오른쪽 위 “레이블 추가”로 첫 레이블을 등록하세요.':'곧 레이블이 공개될 예정이에요.'}</div>`}`;
}
function viewLabel(){
  const l=label(S.labelId); if(!l) return viewLabels();
  const mem=S.members.filter(m=>m.labelId===l.id).sort((a,b)=>(a.order??99)-(b.order??99));
  const hall=S.hall.filter(h=>h.labelId===l.id&&(h.rank||'우승')==='우승').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const site=safeUrl(l.siteUrl);
  return `<button class="btn ghost sm" data-go="labels" style="margin-bottom:22px">← 전체 레이블</button>
    ${l.banner?`<img class="ld-banner" src="${blob(l.banner)}" alt="${esc(l.name)} 배너" onerror="this.remove()">`:''}
    <div class="ld-head" style="--lc:${esc(l.color)}">${seal(l)}
      <div style="flex:1;min-width:200px"><div class="lc-en">${esc(l.en||'')}</div><h1>${esc(l.name)}</h1>${l.tagline?`<p class="lead">${esc(l.tagline)}</p>`:''}</div>
      <div class="lc-actions">${site?`<a class="btn gold" href="${esc(site)}" target="_blank" rel="noopener">공식 홈페이지 ↗</a>`:''}${adminBtn('editLabel','레이블 수정',`data-id="${esc(l.id)}"`)}</div>
    </div>
    <section class="section"><div class="section-title"><h2>멤버 <span class="count">${mem.length}</span></h2>${adminBtn('newMember','+ 멤버 추가',`data-label="${esc(l.id)}"`)}</div>
      ${mem.length?`<div class="member-grid">${mem.map(memberCard).join('')}</div>`:`<div class="empty">아직 등록된 멤버가 없어요.</div>`}</section>
    <section class="section"><div class="section-title"><h2>명예의 전당</h2>${adminBtn('newHall','+ 시즌 1위 추가',`data-label="${esc(l.id)}"`)}</div>
      ${hall.length?`<div class="trophies">${hall.map(trophy).join('')}</div>`:`<div class="empty">아직 시즌 기록이 없어요.</div>`}</section>`;
}

/* live now */
function onAirEvents(){
  const now=Date.now(), t=todayStr();
  return S.events.filter(e=>e.date===t&&e.time).filter(e=>{ const [h,mi]=e.time.split(':').map(Number); const st=new Date(); st.setHours(h,mi||0,0,0); return now>=st.getTime()-30*60000 && now<=st.getTime()+6*3600000; });
}
function liveItems(){
  const out=[];
  onAirEvents().forEach(e=>{ const l=label(e.labelId); out.push({labelId:e.labelId, url:safeUrl(e.link)||safeUrl(l?.siteUrl), media:l?seal(l):'', name:`${l?l.name:'오호컴퍼니'} 단체 방송`, sub:`${e.title} · ${e.time} 시작`, badge:'ON AIR'}); });
  S.members.filter(isLive).forEach(m=>{ const l=label(m.labelId); out.push({labelId:m.labelId, url:liveUrlOf(m), media:`<span class="portrait" style="--lc:${esc(lc(m.labelId))}">${mPhoto(m)?`<img src="${blob(mPhoto(m))}" alt="" onerror="this.remove()">`:initial(m.name)}</span>`, name:m.name, sub:yt(m).liveTitle||(l?l.name:''), badge:'LIVE'}); });
  return out;
}
function viewLive(){
  const all=liveItems(), f=S.liveFilter;
  const shown=f==='all'?all:all.filter(x=>x.labelId===f);
  const tabs=`<div class="chips" role="group" aria-label="레이블별 방송중인 멤버" style="margin-bottom:16px">
    <button class="chip" data-act="liveFilter" data-id="all" aria-pressed="${f==='all'}">전체 <b>${all.length}</b></button>
    ${S.labels.map(l=>`<button class="chip" style="--lc:${esc(l.color)}" data-act="liveFilter" data-id="${esc(l.id)}" aria-pressed="${f===l.id}"><span class="dot"></span>${esc(l.name)} <b>${all.filter(x=>x.labelId===l.id).length}</b></button>`).join('')}
  </div>`;
  const rows=shown.map(x=>{ const inner=`${x.media}<span class="li-t"><b>${esc(x.name)}</b><span>${esc(x.sub)}</span></span><span class="badge-live" style="margin-left:auto">${x.badge}</span>${x.url?`<span class="li-go">보러가기 ↗</span>`:''}`;
    return x.url?`<a class="live-item" href="${esc(x.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="live-item">${inner}</div>`; }).join('');
  return `<section class="live" id="liveNow" aria-label="현재 방송중인 멤버">
    <h2 class="x-title x-row"><span>LIVE</span><span class="x-gold">NOW.<i class="x-caret"></i></span></h2>
    <p class="x-sub"><span class="live-dot ${all.length?'':'off'}"></span>현재 방송중인 멤버 <b>${all.length}</b>명</p>
    ${tabs}
    ${shown.length?`<div class="live-row">${rows}</div>`:`<p class="live-empty" style="margin:0">${f==='all'?'지금은 방송 중인 멤버가 없어요.':'이 레이블은 지금 방송 중인 멤버가 없어요.'}</p>`}
  </section>`;
}
function labelAccordion(){
  if(!S.labels.length) return '';
  const rows=S.labels.map(l=>{
    const open=S.openLabel===l.id;
    const mem=S.members.filter(m=>m.labelId===l.id).sort((a,b)=>(a.order??99)-(b.order??99));
    const site=safeUrl(l.siteUrl);
    return `<div class="acc ${open?'open':''}" style="--lc:${esc(l.color||'#a07b34')}">
      <button class="acc-head" data-act="toggleAcc" data-id="${esc(l.id)}" aria-expanded="${open}">
        <span class="acc-t"><span class="acc-en">${esc(l.en||l.name)}</span><span class="acc-kr">${esc(l.name)}</span></span>
        <svg class="acc-ch" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 9l8 7 8-7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      ${open?`<div class="acc-body">
        ${l.banner?`<img class="acc-banner" src="${blob(l.banner)}" alt="${esc(l.name)} 배너" onerror="this.remove()">`:''}
        <div class="acc-info">
          ${l.tagline?`<p class="acc-tag">${esc(l.tagline)}</p>`:''}
          <div class="acc-mem"><span class="acc-mem-n">멤버 ${mem.length}명</span>${mem.map(m=>`<span class="acc-chip">${isLive(m)?'<i class="live-dot" style="width:6px;height:6px"></i>':''}${esc(m.name)}</span>`).join('')}</div>
          <div class="lc-actions"><button class="btn gold" data-act="openLabel" data-id="${esc(l.id)}">${esc(l.name)} 페이지 →</button>${site?`<a class="btn ghost" href="${esc(site)}" target="_blank" rel="noopener">공식 홈페이지 ↗</a>`:''}</div>
        </div>
      </div>`:''}
    </div>`;
  }).join('');
  return `<section class="labels-x">
    <h2 class="x-title"><span>OUR</span><span class="x-gold">LABELS.<i class="x-caret"></i></span></h2>
    <div class="acc-list">${rows}</div>
  </section>`;
}
function homeBanner(){
  const b=S.home||{};
  if(!b.banner) return S.admin?`<div class="hh-banner-empty"><span>메인 배너 자리예요. 이미지를 넣으면 방문자에게 이곳에 보여요.</span><button class="btn gold sm" data-act="editHomeBanner">배너 이미지 넣기</button></div>`:'';
  const img=`<img src="${blob(b.banner)}" alt="${esc(b.alt||'오호컴퍼니 배너')}" onerror="this.remove()">`;
  const url=safeUrl(b.link);
  const edit=S.admin?`<span class="bn-edit"><button class="btn sm" data-act="editHomeBanner">배너 변경</button></span>`:'';
  return url?`<div class="hh-banner"><a href="${esc(url)}" target="_blank" rel="noopener">${img}</a>${edit}</div>`:`<div class="hh-banner">${img}${edit}</div>`;
}
function homeBannerForm(){
  openForm({title:'메인 배너', data:S.home||{},
    fields:[
      {k:'banner',label:'배너 이미지 (가로로 긴 이미지 권장)',type:'image'},
      {k:'link',label:'클릭하면 이동할 링크 (선택)',type:'url',ph:'https://'},
      {k:'alt',label:'배너 설명 (선택)',ph:'예: 블루라벨 시즌2 오픈'}],
    onSave:d=>saveDoc('settings','home',d),
    onDelete:S.home?.banner?()=>S.db.doc('settings/home').set({banner:null,link:'',alt:''}):null});
}
function viewHome(){
  const live=liveItems().length;
  const posts=sortedPosts().slice(0,5).map(p=>`<button class="post-row ${p.pinned?'pinned':''}" data-act="openPost" data-id="${esc(p.id)}">
      <span class="cat ${p.category==='공지'?'notice':''}">${esc(p.category||'일반')}</span><span class="pt">${esc(p.title)}</span><span class="pd">${esc(fmtTs(p.createdAt))}</span></button>`).join('');
  return `${offlineNote()}
    <section class="home-hero">
      <img class="hh-logo" src="/media/oho-logo.png" alt="OHO.COMPANY">
      <div class="hh-sub">크루방송의 새로운 전환점. <b>오호컴퍼니</b></div>
      <div class="hh-btns"><button class="btn gold" data-act="scrollLive"><span class="live-dot ${live?'':'off'}"></span>현재 방송중인 멤버 ${live}</button><button class="btn" data-go="members">멤버 보기</button><button class="btn ghost" data-go="apply">크루 지원하기</button></div>
      ${homeBanner()}
    </section>
    ${viewLive()}
    ${labelAccordion()}
    <section class="section"><h2 class="x-title x-row" style="gap:0"><span>NOTICE</span><span class="x-gold">.<i class="x-caret"></i></span></h2>
      <div class="x-sub" style="justify-content:space-between"><span>공지사항</span><button class="btn ghost sm" data-go="board">전체 보기 →</button></div>

function memberMarquee(){
  const rows=S.labels.map((l,i)=>{
    const mem=S.members.filter(m=>m.labelId===l.id).sort((a,b)=>(a.order??99)-(b.order??99));
    if(!mem.length) return '';
    const card=(m,dup)=>{const ph=m.mqPhoto||mPhoto(m); return `<button class="mq-card" style="--lc:${esc(l.color)}" data-act="jumpMember" data-id="${esc(m.id)}" ${dup?'tabindex="-1" aria-hidden="true"':`aria-label="${esc(m.name)} 위치로 이동"`}>${ph?`<img src="${blob(ph)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="mq-init">${initial(m.name)}</span>`}<span class="mq-cap"><small>#${esc(l.name)}</small><b>${esc(m.name)}</b></span>${isLive(m)?'<span class="badge-live mq-live">LIVE</span>':''}</button>`;};
    let base=mem; while(base.length<8) base=base.concat(mem);
    const track=base.map(m=>card(m,false)).join(''), track2=base.map(m=>card(m,true)).join('');
    const dur=Math.max(40,base.length*4.5);
    return `<div class="mq-row ${i%2?'rev':''}"><div class="mq-track" style="animation-duration:${dur}s">${track}${track2}</div></div>`;
  }).join('');
  return rows?`<section class="mq" aria-label="멤버 사진">${rows}</section>`:'';
}

  </div>`;

function viewSchedule(){
  const m=S.month, y=m.getFullYear(), mo=m.getMonth();
  const first=new Date(y,mo,1), days=new Date(y,mo+1,0).getDate();
  const weeks=Math.ceil((first.getDay()+days)/7);
  const start=new Date(y,mo,1-first.getDay());
  const t=todayStr();
  const sel=S.selDay||t;
  let cells=DOW.map((d,i)=>`<div class="dow ${i===0?'sun':''}">${d}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=ymd(d), out=d.getMonth()!==mo;
    const evs=S.events.filter(e=>e.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    cells+=`<button class="cell ${out?'out':''} ${ds===t?'today':''} ${ds===sel?'sel':''}" data-act="pickDay" data-date="${ds}" aria-label="${esc(fmtDate(ds))} 일정 ${evs.length}개" aria-pressed="${ds===sel}">
      <span class="dnum">${d.getDate()}</span>
      ${evs.map(e=>`<span class="ev" style="--lc:${esc(lc(e.labelId))}" title="${esc(shortName(e.labelId)+' '+e.title)}"><b>${esc(shortName(e.labelId))}</b> ${esc(e.title)}</span>`).join('')}
    </button>`;
  }
  const dayEvents=S.events.filter(e=>e.date===sel).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const monthEvents=S.events.filter(e=>e.date.startsWith(`${y}-${pad(mo+1)}`)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  return `${offlineNote()}<div class="page-head"><div><div class="eyebrow">Schedule</div><h1>스케줄</h1><p class="lead">날짜를 누르면 그날 방송 일정이 아래에 나와요.</p>${loadingNote()}</div>${adminBtn('newEvent','+ 일정 추가',`data-date="${t}"`)}</div>
    <div class="cal-bar"><div class="cal-month">${y}.${pad(mo+1)}<small>${monthEvents.length}개 일정</small></div>
      <div style="display:flex;gap:6px"><button class="btn sm" data-act="month" data-d="-1" aria-label="이전 달">‹ 이전</button><button class="btn sm" data-act="month" data-d="0">오늘</button><button class="btn sm" data-act="month" data-d="1" aria-label="다음 달">다음 ›</button></div></div>
    <div class="cal-wrap"><div class="cal">${cells}</div></div>
    <div class="legend">${S.labels.map(l=>`<span style="--lc:${esc(l.color)}"><i></i>${esc(l.name)}</span>`).join('')}<span style="--lc:#c9a45c"><i></i>오호컴퍼니 공통</span></div>
    <section class="day-list">
      <div class="day-head"><h2>${esc(fmtDate(sel))}${sel===t?' <span class="tag" style="--lc:var(--gold)">오늘</span>':''}</h2>${adminBtn('newEvent','+ 이 날 일정 추가',`data-date="${sel}"`)}</div>
      ${dayEvents.length?`<div class="ev-list" style="margin-top:0">${dayEvents.map(eventRow).join('')}</div>`:`<div class="empty">이 날은 등록된 방송 일정이 없어요.${S.admin?' 위 버튼으로 추가할 수 있어요.':''}</div>`}
    </section>`;
}

/* ---------- modal form ---------- */
const modalRoot=document.getElementById('modalRoot');
let modalState=null;
function labelOptions(withNone){ return (withNone?[{v:'',t:withNone}]:[]).concat(S.labels.map(l=>({v:l.id,t:l.name}))); }
function openForm({title,fields,data={},onSave,onDelete}){
  modalState={fields,data:{...data},onSave,onDelete,images:{}};
  const fh=fields.map(f=>{
    const id='mf_'+f.k, v=data[f.k]??f.def??'';
    const req=f.req?' <span class="req">*</span>':'';
    let input;
    if(f.type==='textarea') input=`<textarea id="${id}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else if(f.type==='select') input=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
    else if(f.type==='checkbox') return `<label class="agree"><input type="checkbox" id="${id}" ${v?'checked':''}><span>${esc(f.label)}</span></label>`;
    else if(f.type==='color') input=`<input type="color" id="${id}" value="${esc(v||'#c9a45c')}">`;
    else if(f.type==='image'){
      if(!S.assets) return '';
      modalState.images[f.k]=v||null;
      return `<div class="field"><span class="lbl">${esc(f.label)}</span><div class="img-field"><div class="pv" id="${id}_pv">${v?`<img src="${blob(v)}" alt="">`:'없음'}</div>
        <div style="display:flex;flex-direction:column;gap:6px"><input type="file" id="${id}" accept="image/png,image/jpeg,image/webp,image/gif" data-img="${f.k}"><span class="msg ok" id="${id}_st"></span>${v?`<button type="button" class="btn sm ghost" data-act="clearImg" data-k="${f.k}" style="align-self:flex-start">이미지 빼기</button>`:''}</div></div></div>`;
    }
    else input=`<input type="${f.type||'text'}" id="${id}" value="${esc(v)}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}">`;
    return `<div class="field"><label for="${id}">${esc(f.label)}${req}</label>${input}${f.help?`<span style="font-size:12px;color:var(--faint)">${esc(f.help)}</span>`:''}</div>`;
  }).join('');
  modalRoot.innerHTML=`<div class="modal-bg" data-act="closeBg"><form class="modal" id="modalForm" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h2>${esc(title)}</h2>${fh}<div class="msg" id="modalMsg" role="alert"></div>
    <div class="modal-foot">${onDelete?`<span id="delZone"><button type="button" class="btn danger" data-act="askDelete">삭제</button></span>`:''}
      <div class="r"><button type="button" class="btn ghost" data-act="closeModal">취소</button><button type="submit" class="btn gold" id="modalSave">저장</button></div></div>
  </form></div>`;
  const firstInput=modalRoot.querySelector('input,textarea,select'); firstInput&&firstInput.focus();
}
function closeModal(){ modalRoot.innerHTML=''; modalState=null; }
function collectModal(){
  const out={...modalState.data}; delete out.id;
  for(const f of modalState.fields){
    const el=document.getElementById('mf_'+f.k);
    if(f.type==='image'){ if(S.assets) out[f.k]=modalState.images[f.k]||null; continue; }
    if(!el) continue;
    if(f.type==='checkbox') out[f.k]=el.checked;
    else if(f.type==='number') out[f.k]=el.value===''?null:Number(el.value);
    else out[f.k]=el.value.trim();
    if(f.req && !out[f.k] && out[f.k]!==0) throw new Error(`“${f.label}”을(를) 입력해 주세요.`);
    if(f.type==='url' && out[f.k] && !safeUrl(out[f.k])) throw new Error(`“${f.label}”은 https:// 로 시작하는 주소로 넣어주세요.`);
  }
  return out;
}
async function saveDoc(col,id,data){
  if(!S.db) throw new Error('저장소에 연결되지 않았어요.');
  if(id) await S.db.doc(col+'/'+id).set(data); else await S.db.collection(col).add(data);
}
function errText(e){
  if(e&&e.code==='invalid_argument') return '저장 권한이 없어요. 편집 권한이 있는 계정으로 열어주세요.';
  if(e&&e.code==='quota_exceeded') return '저장 공간이 가득 찼어요. 오래된 항목을 지운 뒤 다시 시도해 주세요.';
  return (e&&e.message)||'저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}

/* ---------- events ---------- */
document.addEventListener('click', async ev=>{
  const g=ev.target.closest('[data-go]');
  if(g){ go(g.dataset.go); return; }
  const t=ev.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(a==='closeBg'){ if(ev.target===t) closeModal(); return; }
  if(a==='showEvent'||a==='editEvent'){ ev.stopPropagation(); const e=S.events.find(x=>x.id===id); if(!e) return;
    if(S.admin) return eventForm(e);
    const l=label(e.labelId);
    modalRoot.innerHTML=`<div class="modal-bg" data-act="closeBg"><div class="modal" role="dialog" aria-modal="true"><span class="tag" style="--lc:${esc(lc(e.labelId))};align-self:flex-start">${esc(l?l.name:'오호컴퍼니')}</span><h2>${esc(e.title)}</h2><p class="lead" style="margin:0">${esc(fmtDate(e.date))} ${esc(e.time||'')}</p>${e.memo?`<p style="margin:0">${esc(e.memo)}</p>`:''}<div class="modal-foot"><div class="r">${safeUrl(e.link)?`<a class="btn gold" href="${esc(safeUrl(e.link))}" target="_blank" rel="noopener">방송 보기 ↗</a>`:''}<button class="btn" data-act="closeModal">닫기</button></div></div></div></div>`;
    return; }
  switch(a){
    case 'openLabel': go('labels',{labelId:id}); break;
    case 'newLabel': labelForm(); break;
    case 'editLabel': labelForm(label(id)); break;
    case 'newMember': memberForm(null,t.dataset.label); break;
    case 'editMember': memberForm(S.members.find(x=>x.id===id)); break;
    case 'toggleLive': { const m=S.members.find(x=>x.id===id); if(!m) break; const inPop=!!t.closest('.mp'); t.disabled=true; try{ await S.db.doc('members/'+id).update({live:!m.live}); if(inPop){ m.live=!m.live; memberPopup(id); } }catch(e){ t.disabled=false; t.textContent='저장 실패'; } break; }
    case 'editHomeBanner': homeBannerForm(); break;
    case 'toggleAcc': S.openLabel=S.openLabel===id?null:id; render(); break;
    case 'openMember': memberPopup(id); break;
    case 'jumpMember': { const m=S.members.find(x=>x.id===id); if(m&&S.memberFilter!=='all'&&S.memberFilter!==m.labelId){ S.memberFilter='all'; render(); }
      const el=document.getElementById('m-'+id); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } break; }
    case 'adminLogin': modalState={fields:[],data:{},images:{}}; modalRoot.innerHTML=`<div class="modal-bg" data-act="closeBg"><form class="modal" id="loginForm" style="width:min(380px,100%)" novalidate><h2>관리자 로그인</h2><div class="field"><label for="lg_pw">비밀번호</label><input type="password" id="lg_pw" autocomplete="current-password"></div><div class="msg" id="lgMsg" role="alert"></div><div class="modal-foot"><div class="r"><button type="button" class="btn ghost" data-act="closeModal">취소</button><button type="submit" class="btn gold">로그인</button></div></div></form></div>`; document.getElementById('lg_pw').focus(); break;
    case 'adminLogout': window.OHO.logout(); location.reload(); break;
    case 'liveFilter': S.liveFilter=id; render(); break;
    case 'scrollLive': document.getElementById('liveNow')?.scrollIntoView({behavior:'smooth',block:'start'}); break;
    case 'memberFilter': S.memberFilter=id; render(); break;
    case 'month': { const d=+t.dataset.d; S.month=d===0?startOfMonth(new Date()):new Date(S.month.getFullYear(),S.month.getMonth()+d,1); render(); break; }
    case 'pickDay': S.selDay=t.dataset.date; render(); document.querySelector('.day-list')?.scrollIntoView({behavior:'smooth',block:'nearest'}); break;
    case 'newEvent': eventForm(null,t.dataset.date); break;
    case 'newHall': hallForm(null,t.dataset.label); break;
    case 'editHall': hallForm(S.hall.find(x=>x.id===id)); break;
    case 'newPost': postForm(); break;
    case 'editPost': postForm(S.posts.find(x=>x.id===id)); break;
    case 'openPost': go('board',{postId:id}); break;
    case 'reapply': S.applyDone=false; render(); break;
    case 'closeModal': closeModal(); break;
    case 'clearImg': { const k=t.dataset.k; modalState.images[k]=null; document.getElementById('mf_'+k+'_pv').innerHTML='없음'; t.remove(); break; }
    case 'askDelete': document.getElementById('delZone').innerHTML=`<span style="font-size:13px;color:var(--bad);margin-right:8px">되돌릴 수 없어요.</span><button type="button" class="btn danger" data-act="doDelete">삭제 확정</button>`; break;
    case 'doDelete': { const msg=document.getElementById('modalMsg'); try{ await modalState.onDelete(); closeModal(); render(); }catch(e){ msg.textContent=errText(e); } break; }
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&modalState) closeModal();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.ev[role=button]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', async ev=>{
  const t=ev.target;
  if(t.dataset.img && t.files?.[0]){
    const k=t.dataset.img, st=document.getElementById(t.id+'_st'), f=t.files[0];
    if(f.size>30*1024*1024){ st.className='msg'; st.textContent='30MB 이하 이미지만 올릴 수 있어요.'; return; }
    st.className='msg ok'; st.textContent='올리는 중…';
    document.getElementById('modalSave').disabled=true;
    try{ const r=await S.assets.upload(f); modalState.images[k]=r.id; document.getElementById(t.id+'_pv').innerHTML=`<img src="${r.url}" alt="">`; st.textContent='올렸어요. 저장을 눌러 반영하세요.'; }
    catch(e){ st.className='msg'; st.textContent=e?.message||'이미지를 올리지 못했어요. 다시 시도해 주세요.'; }
    finally{ const b=document.getElementById('modalSave'); if(b) b.disabled=false; }
  }
  if(t.dataset.act==='appStatus'){
    try{ await S.db.doc('applications/'+t.dataset.id).update({status:t.value}); }catch(e){ t.insertAdjacentHTML('afterend',`<span class="msg"> ${esc(errText(e))}</span>`); }
  }
});
document.addEventListener('submit', async ev=>{
  ev.preventDefault();
  if(ev.target.id==='loginForm'){
    const msg=document.getElementById('lgMsg');
    try{ await window.OHO.login(document.getElementById('lg_pw').value); location.reload(); }catch(e){ msg.textContent=e.message||'로그인하지 못했어요'; }
    return;
  }
  if(ev.target.id==='modalForm'){
    const msg=document.getElementById('modalMsg'), btn=document.getElementById('modalSave');
    try{ const d=collectModal(); btn.disabled=true; btn.textContent='저장 중…'; await modalState.onSave(d); closeModal(); render(); }
    catch(e){ msg.textContent=errText(e); btn.disabled=false; btn.textContent='저장'; }
  }
  if(ev.target.id==='applyForm'){
    const f=ev.target, msg=document.getElementById('applyMsg'), btn=document.getElementById('applyBtn');
    const v=n=>(f.elements[n]?.value||'').trim();
    const data={name:v('name'),phone:v('phone'),birthYear:v('birthYear'),labelWish:v('labelWish'),platform:v('platform'),career:v('career'),channelUrl:v('channelUrl'),
      days:[...f.querySelectorAll('input[name=days]:checked')].map(x=>x.value),intro:v('intro'),agree:f.elements.agree.checked};
    if(!data.name||!data.phone||!data.birthYear||!data.intro){ msg.textContent='* 표시된 항목을 모두 채워주세요.'; return; }
    if(!/^[0-9\-+ ]{9,20}$/.test(data.phone)){ msg.textContent='연락처는 숫자와 - 만 써서 입력해 주세요.'; return; }
    if(data.channelUrl&&!safeUrl(data.channelUrl)){ msg.textContent='링크는 https:// 로 시작하는 주소로 넣어주세요.'; return; }
    if(!data.agree){ msg.textContent='개인정보 수집에 동의해야 제출할 수 있어요.'; return; }
    data.status=S.applied?.status||'new'; data.createdAt=S.applied?.createdAt||Date.now(); data.updatedAt=Date.now();
    btn.disabled=true; btn.textContent='제출 중…';
    try{ await S.db.doc('applications/'+S.uid).set(data); S.applied=data; S.applyDone=true; render(); }
    catch(e){ msg.textContent=e?.code==='invalid_argument'?'이 계정으로는 지원서를 제출할 수 없어요. 관리자에게 문의해 주세요.':errText(e); btn.disabled=false; btn.textContent='지원서 제출'; }
  }
});

/* ---------- data ---------- */
function applyDirty(){ const f=document.getElementById('applyForm'); return !!f && [...f.elements].some(e=>e.name && e.tagName!=='SELECT' && (e.type==='checkbox'?e.checked:e.value)); }
function sub(col, key, q){
  q.onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); if(!applyDirty()) render(); }, err=>{ console.warn(col,err); });
}
async function init(){
  fromHash(); render();
  const C=window.claude;
  if(!C||!C.use){ S.offline=true; S.ready=true; render(); return; }
  const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
  if(!db){ S.offline=true; S.ready=true; render(); return; }
  S.db=db;
  if(user){ S.uid=await user.id(); S.admin=await user.canEdit(); }
  S.assets=S.admin?await C.use('assets'):null;
  db.doc('settings/home').onSnapshot(sn=>{ S.home=sn.exists?sn.data():null; if(!applyDirty()) render(); }, e=>console.warn('home',e));
  sub('labels','labels',db.collection('labels').orderBy('order'));
  sub('members','members',db.collection('members'));
  sub('events','events',db.collection('events').orderBy('date'));
  sub('hall','hall',db.collection('hall'));
  sub('posts','posts',db.collection('posts'));
  if(S.admin) sub('applications','apps',db.collection('applications'));
  if(S.uid){ try{ const s=await db.doc('applications/'+S.uid).get(); if(s.exists) S.applied=s.data(); }catch(e){} }
  S.ready=true; render();
  loadYT(); setInterval(()=>{ if(!document.hidden) loadYT(); },60000);
}
async function loadYT(){ try{ const r=await fetch('/api/youtube'); const j=await r.json(); S.yt=j.members||{}; if(!applyDirty()&&!modalState) render(); }catch(e){} }
window.addEventListener('hashchange',()=>{ fromHash(); S.labelId=null; S.postId=null; S.memberId=null; render(); });
setInterval(()=>{ if(S.tab==='home'&&!modalState) render(); },60000);
init();
})();
</script>
