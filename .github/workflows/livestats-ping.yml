# 5분마다 사이트의 방송 기록(api/livestats)을 불러서,
# 아무도 사이트를 안 보고 있어도 방송 기록이 쌓이게 함
name: Live stats ping
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping livestats
        run: curl -sS -m 60 -o /dev/null -w "%{http_code}\n" https://oho-company-site.vercel.app/api/livestats || true
